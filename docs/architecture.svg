<svg width="1160" height="600" viewBox="0 0 1160 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Pretendard,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#CA8A04"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="600" fill="#FFFFFF"/>

  <text x="20" y="30" font-size="18" font-weight="700" fill="#0F172A">Tollm — 요청 처리 파이프라인</text>
  <text x="20" y="50" font-size="12.5" fill="#64748B">/v1 요청 하나가 응답으로 나가기까지 거치는 6단계 (박스 안 붉은 줄 = 그 단계에서 즉시 거부되는 조건)</text>

  <!-- Row 1: main pipeline, y=100 h=96 -->
  <!-- Client -->
  <rect x="20" y="100" width="100" height="96" rx="8" fill="#0F172A"/>
  <text x="70" y="153" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Client</text>

  <!-- 1 Auth -->
  <rect x="160" y="100" width="150" height="96" rx="8" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="235" y="120" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">1 · 인증</text>
  <text x="235" y="139" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">Auth Filter</text>
  <text x="235" y="156" font-size="10" fill="#475569" text-anchor="middle">JWT / API Key(SHA-256)</text>
  <text x="235" y="171" font-size="10" fill="#475569" text-anchor="middle">Caffeine 캐시 TTL 30s</text>
  <text x="235" y="190" font-size="10" fill="#DC2626" text-anchor="middle">실패 → 401</text>

  <!-- 2 Rate limit -->
  <rect x="350" y="100" width="150" height="96" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="425" y="120" font-size="10.5" font-weight="700" fill="#16A34A" text-anchor="middle">2 · 제한</text>
  <text x="425" y="139" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">Rate Limit + Quota</text>
  <text x="425" y="156" font-size="10" fill="#475569" text-anchor="middle">Redis 토큰버킷</text>
  <text x="425" y="171" font-size="10" fill="#475569" text-anchor="middle">Lua로 원자적 차감</text>
  <text x="425" y="190" font-size="10" fill="#DC2626" text-anchor="middle">초과 → 429</text>

  <!-- 3 Cache -->
  <rect x="540" y="100" width="150" height="96" rx="8" fill="#FEFCE8" stroke="#FDE047"/>
  <text x="615" y="120" font-size="10.5" font-weight="700" fill="#CA8A04" text-anchor="middle">3 · 캐시</text>
  <text x="615" y="139" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">Response Cache</text>
  <text x="615" y="156" font-size="10" fill="#475569" text-anchor="middle">정규화 본문 → SHA-256</text>
  <text x="615" y="171" font-size="10" fill="#475569" text-anchor="middle">팀은 team:{id} 공유</text>
  <text x="615" y="190" font-size="10" fill="#CA8A04" text-anchor="middle">HIT ↓ 아래로 단축</text>

  <!-- 4 Provider routing (BYOK) -->
  <rect x="730" y="100" width="150" height="96" rx="8" fill="#FDF2F8" stroke="#F9A8D4"/>
  <text x="805" y="120" font-size="10.5" font-weight="700" fill="#DB2777" text-anchor="middle">4 · 라우팅 (BYOK)</text>
  <text x="805" y="139" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">Provider Router</text>
  <text x="805" y="156" font-size="10" fill="#475569" text-anchor="middle">개인/팀 등록 키 AES-GCM 복호화</text>
  <text x="805" y="171" font-size="10" fill="#475569" text-anchor="middle">서버 공용키 폴백 없음</text>
  <text x="805" y="190" font-size="10" fill="#DC2626" text-anchor="middle">포화 → 503</text>

  <!-- External providers -->
  <rect x="920" y="100" width="200" height="96" rx="8" fill="#fff" stroke="#CBD5E1"/>
  <text x="1020" y="122" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">외부 LLM API</text>
  <text x="1020" y="150" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="middle">OpenAI 호환 형식</text>
  <text x="1020" y="172" font-size="11.5" font-weight="600" fill="#0F172A" text-anchor="middle">Anthropic (어댑터)</text>

  <!-- pipeline arrows -->
  <line x1="120" y1="148" x2="160" y2="148" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="310" y1="148" x2="350" y2="148" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="148" x2="540" y2="148" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="690" y1="148" x2="730" y2="148" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="880" y1="148" x2="920" y2="148" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Row 2: logging + response, y=330 h=90 -->
  <rect x="350" y="330" width="420" height="90" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="560" y="354" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">5 · 로깅 · 집계</text>
  <text x="560" y="376" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">RequestLog (MySQL)</text>
  <text x="560" y="396" font-size="10" fill="#64748B" text-anchor="middle">user / team / apiKey 3축 집계</text>
  <text x="560" y="411" font-size="10" fill="#64748B" text-anchor="middle">l.team IS NULL 로 개인·팀 사용량 분리</text>

  <rect x="20" y="345" width="120" height="60" rx="8" fill="#0F172A"/>
  <text x="80" y="380" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Response</text>

  <!-- external -> logging -->
  <path d="M 1020 196 L 1020 375 L 770 375" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- cache hit shortcut straight down into logging -->
  <path d="M 615 196 L 615 330" fill="none" stroke="#CA8A04" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <!-- logging -> response -->
  <line x1="350" y1="380" x2="140" y2="378" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Team add-on note -->
  <rect x="20" y="450" width="850" height="80" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="40" y="474" font-size="11" font-weight="700" fill="#C2410C">Add-on 구조 — 팀 기능은 개인 흐름 위에 nullable 컬럼으로만 얹혀 있다</text>
  <text x="40" y="494" font-size="10.5" fill="#7C2D12">ApiKey.team / RequestLog.team 이 null 이면 위 파이프라인은 기존 개인 경로와 100% 동일 코드로 실행된다.</text>
  <text x="40" y="510" font-size="10.5" fill="#7C2D12">relay(userId, body) 는 내부적으로 relay(userId, null, body) 를 호출할 뿐이라, 이 구조를 추가할 때 기존 테스트가 한 줄도 안 바뀌었다.</text>

  <text x="20" y="560" font-size="10.5" fill="#94A3B8">회색 실선 = 정상 경로 · 박스 안 붉은 글씨 = 그 단계 실패 시 응답 코드 · 노란 점선 = 캐시 히트 시 프로바이더 호출을 건너뛰는 경로</text>
</svg>
