# Tollm Nginx 리버스 프록시 설정 (과제 gist 기반 + Tollm에 맞게 조정)
# 적용:
#   sudo cp deploy/nginx-tollm.conf /etc/nginx/sites-available/tollm
#   sudo ln -sf /etc/nginx/sites-available/tollm /etc/nginx/sites-enabled/tollm
#   sudo rm -f /etc/nginx/sites-enabled/default   # 기본 사이트 비활성화
#   sudo nginx -t && sudo systemctl restart nginx
#
# 왜 Nginx를 앞에 두나: 앱(8080)을 외부에 직접 노출하지 않고 80/443만 열어 Nginx가 받게 한다.
# 보안그룹에서 8080은 열지 않는다(Nginx만 127.0.0.1:8080으로 내부 접근).

server {
    listen 80;
    listen [::]:80;

    # 도메인이 있으면 여기에 (예: api.mytollm.kr). 없으면 _ 로 두면 IP로 접속된다.
    server_name _;

    # /v1 프록시는 외부 LLM 응답을 기다리느라 느릴 수 있다. 앱 read timeout(60초)보다
    # 크게 잡아, 앱이 아직 응답 중인데 Nginx가 먼저 504로 끊는 상황을 막는다.
    proxy_read_timeout 75s;
    proxy_connect_timeout 5s;

    # LLM 프롬프트 본문이 클 수 있으므로 업로드 상한을 앱의 1MB 제한(SEC-02)에 맞춰 넉넉히
    client_max_body_size 2m;

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:8080;
    }
}
